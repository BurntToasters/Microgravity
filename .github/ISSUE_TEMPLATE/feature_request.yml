name: Feature request
description: Suggest an improvement or a new capability for Microgravity.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search existing issues and discussions in the issue tracker first.

        For security vulnerabilities, follow the private process in [SECURITY.md](https://github.com/BurntToasters/Microgravity/blob/main/SECURITY.md).

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way today?
      placeholder: I want to ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or UI you would like. Keep it as specific as you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or designs you have tried.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots, links, or related issues. Remove personal information and secrets.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate request.
          required: true
        - label: I removed personal information, tokens, and other secrets from anything I attached.
          required: true
        - label: I agree to follow this project's Code of Conduct.
          required: true
