name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 26 or newer
        run: |
          xcode="$(find /Applications -maxdepth 1 -type d \( -name 'Xcode_26*.app' -o -name 'Xcode_27*.app' \) -print | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "::error::Microgravity CI needs Xcode 26 or newer. Installed: $(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run project:sync -- --check
      - run: npm run sync-version -- --check
      - run: npm run validate
      - run: npm run test:node
      - name: Run unsigned Core XCTest
        run: |
          rm -rf DerivedData/TestResults/Microgravity-Core.xcresult
          mkdir -p DerivedData/TestResults
          xcodebuild \
            -project Microgravity.xcodeproj \
            -scheme Test \
            -configuration Debug \
            -derivedDataPath "$PWD/DerivedData/Tests" \
            -clonedSourcePackagesDirPath "$PWD/DerivedData/SourcePackages" \
            -packageCachePath "$PWD/DerivedData/PackageCache" \
            -destination 'platform=macOS,arch=arm64' \
            -parallel-testing-enabled NO \
            -resultBundlePath "$PWD/DerivedData/TestResults/Microgravity-Core.xcresult" \
            -only-testing:MicrogravityCoreTests \
            test \
            CODE_SIGNING_ALLOWED=NO \
            SPARKLE_ENABLE_AUTOMATIC_CHECKS=NO
      - run: npm run build:debug
      - run: npm run build:release-smoke
